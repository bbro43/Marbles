<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Bakugan — My Room</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192-v2.png">
<style>
  /* Same two DS screens as the title menu (256x192 each, DS pixels), scaled to the phone. */
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; height:100%; background:#000; color:#fff; overflow:hidden; font-family: system-ui,-apple-system,"Segoe UI",sans-serif; }
  #ds { position:fixed; left:0; top:0; width:256px; height:384px; transform-origin:0 0; }
  .scr { position:absolute; left:0; width:256px; height:192px; overflow:hidden; background:#200; }
  #top { top:0; } #bot { top:192px; }
  #view3d { position:absolute; left:0; top:0; width:256px; height:192px; }
  #view3d canvas { display:block; width:256px !important; height:192px !important; touch-action:none; }
  .scr img, .px { position:absolute; image-rendering:pixelated; image-rendering:crisp-edges; user-select:none; -webkit-user-drag:none; }
  .tap { cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .tap:active, .tap.on { filter: brightness(1.25) drop-shadow(0 0 2px #4cc3ff) drop-shadow(0 0 1px #4cc3ff); }
  .off { filter: grayscale(.85) brightness(.6); }
  #bar { position:absolute; left:0; right:0; top:4px; height:12px; overflow:hidden; z-index:20; pointer-events:none; }
  #barText { position:absolute; top:0; white-space:nowrap; font: 600 9px/12px ui-monospace,"Courier New",monospace; color:#fff; }
  #barText.run { animation: tick linear infinite; }
  @keyframes tick { from { transform: translateX(256px); } to { transform: translateX(var(--to)); } }
  .txt { position:absolute; font: 700 10px/12px system-ui,sans-serif; color:#fff; text-shadow:0 1px 0 #000; }
  /* DS-style dark blue buttons */
  .pill { position:absolute; height:18px; border-radius:4px; background:linear-gradient(#123d70, #071f44); border:1px solid #8fb4d8; box-shadow:inset 0 0 0 1px #0a1a33;
          color:#fff; font: 600 10px/16px system-ui,sans-serif; text-align:center; text-shadow:0 1px 0 #000; }
  .pill.sel { background:linear-gradient(#35a8f0, #1478c8); border-color:#d6f0ff; }
  .pill.gold { background:linear-gradient(#f5d36a, #b98a16); border-color:#fff3c4; color:#2a1600; text-shadow:none; font-weight:800; }
  .box { position:absolute; background:#0d2140e6; border:1px solid #7fb0e0; border-radius:4px; }
  .dot { position:absolute; width:11px; height:11px; border-radius:50%; border:1px solid #0008; }
  .dot.sel { outline:2px solid #ff8a1c; outline-offset:1px; }
  .icon { position:absolute; width:36px; height:36px; image-rendering:pixelated; }
  .icon.sel { outline:2px solid #ff8a1c; outline-offset:0; }
  .bubble { position:absolute; left:4px; right:4px; bottom:4px; min-height:46px; background:linear-gradient(#1b7ea8, #0d5374); border:2px solid #d9f3ff; border-radius:8px;
            padding:12px 8px 6px; font: 600 9px/12px ui-monospace,"Courier New",monospace; }
  .bubble b { position:absolute; left:8px; top:2px; font: 800 9px/11px system-ui,sans-serif; }
  .row { position:absolute; left:20px; width:200px; height:16px; background:linear-gradient(90deg, #0f6b77, #0b3d46); border:1px solid #39c7d6; border-radius:2px;
         font: 700 9px/14px system-ui,sans-serif; padding:0 6px; display:flex; justify-content:space-between; }
  .row.me { background:linear-gradient(90deg, #1e9ad0, #0e4c7a); border-color:#cff3ff; }
  .slot { position:absolute; width:76px; height:72px; background:linear-gradient(#5b5f66, #34373c); border:2px solid #9aa0a8; border-radius:4px; }
  .slot.sel { border-color:#4cc3ff; box-shadow:0 0 0 1px #4cc3ff; }
  .slot .nm { position:absolute; left:0; right:0; bottom:2px; height:12px; background:linear-gradient(#2ad0f0, #0a6c90); border-radius:6px; margin:0 3px;
              font: 800 8px/12px system-ui,sans-serif; text-align:center; }
  .slot .face { left:22px; top:8px; width:32px; height:32px; }
  .slot .empty { position:absolute; left:0; right:0; top:22px; text-align:center; font: 800 10px/12px system-ui,sans-serif; color:#d8dde3; text-shadow:0 1px 0 #000; }
  input.name { position:absolute; left:40px; top:80px; width:176px; height:22px; font: 600 12px system-ui,sans-serif; border-radius:4px; border:2px solid #7fb0e0; padding:0 6px; z-index:40; }
</style>
</head>
<body>
<div id="ds">
  <div class="scr" id="top"><div id="view3d"></div><div id="topUI"></div></div>
  <div class="scr" id="bot"></div>
</div>
<script src="js/home.js"></script>
<script src="vendor/jszip.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
<script type="module" src="js/room.js"></script>
</body>
</html>
