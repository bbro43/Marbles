<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Bakugan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192-v2.png">
<link rel="apple-touch-icon" href="icons/icon-192-v2.png">
<style>
  /* Two DS-sized screens (256x192 each) stacked like the DS, scaled up to fit the phone. All coordinates are DS pixels. */
  * { box-sizing: border-box; }
  [hidden] { display:none !important; }
  html, body { margin:0; height:100%; background:#000; color:#fff; overflow:hidden; font-family: system-ui,-apple-system,"Segoe UI",sans-serif; }
  #ds { position:fixed; left:0; top:0; width:256px; height:384px; transform-origin:0 0; }
  .scr { position:absolute; left:0; width:256px; height:192px; overflow:hidden; background:#200; }
  #top { top:0; } #bot { top:192px; }
  .scr img, .px { position:absolute; image-rendering:pixelated; image-rendering:crisp-edges; user-select:none; -webkit-user-drag:none; }
  .tap { cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .tap:active, .tap.on { filter: brightness(1.25) drop-shadow(0 0 2px #4cc3ff) drop-shadow(0 0 1px #4cc3ff); }
  .off { filter: grayscale(.85) brightness(.6); }
  /* scrolling message bar at the top of the bottom screen */
  #bar { position:absolute; left:0; right:0; top:4px; height:12px; overflow:hidden; z-index:20; pointer-events:none; }
  #barText { position:absolute; top:0; white-space:nowrap; font: 600 9px/12px ui-monospace,"Courier New",monospace; color:#fff; letter-spacing:.2px; }
  #barText.run { animation: tick linear infinite; }
  @keyframes tick { from { transform: translateX(256px); } to { transform: translateX(var(--to)); } }
  .txt { position:absolute; font: 700 10px/12px system-ui,sans-serif; color:#fff; text-shadow:0 1px 0 #000; }
  /* our raised buttons: light metal frame, red face, clipped corners, pressed look when tapped */
  .obtn { position:absolute; left:40px; width:176px; height:20px; padding:0 8px; box-sizing:border-box; color:#fff; border:0; cursor:pointer;
          font: italic 800 9px/20px system-ui,sans-serif; text-align:center; letter-spacing:.3px; text-shadow:0 1px 0 #000, 0 0 3px #000;
          background: linear-gradient(#e2574e, #b3221b 48%, #8e1510 52%, #a51d16);
          clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px);
          box-shadow: inset 0 0 0 1.5px #d9dde3, inset 0 0 0 2.5px #6b6f76, inset 0 3px 0 2px #ff9c94aa, 0 2px 0 #000; }
  .obtn.sel { background: linear-gradient(#f5d36a, #d99a1e 48%, #b77d10 52%, #c88a18); color:#2a1500; text-shadow:0 1px 0 #ffe9a8; }
  .obtn:active { transform: translateY(1.5px); filter: brightness(.85); }
  .obtn.huge { height:38px; font-size:15px; line-height:38px; letter-spacing:1px; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
  .obtn.big { height:30px; font-size:10px; line-height:13px; display:flex; flex-direction:column; justify-content:center; }
  .obtn.big small { font: 700 7px/9px system-ui,sans-serif; letter-spacing:1px; color:#ffd9d4; font-style:normal; }
  .obtn.big .arr { position:absolute; top:0; bottom:0; width:18px; font:900 13px/30px system-ui,sans-serif; font-style:normal; color:#ffd9d4; }
  .obtn.big .arr.l { left:6px; } .obtn.big .arr.r { right:6px; }
  .rows { position:absolute; left:26px; right:20px; top:44px; font: 600 8.5px/12px system-ui,sans-serif; }
  .rows div { display:flex; justify-content:space-between; border-bottom:1px solid #ffffff22; }
  .rows span:last-child { color:#ffd0c8; }
  .fade { transition: opacity .5s; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<div id="ds">
  <div class="scr" id="top"></div>
  <div class="scr" id="bot"></div>
</div>
<input type="file" id="packFile" accept=".zip,application/zip">
<script src="js/home.js"></script>
<script src="vendor/jszip.min.js"></script>
<script>
// ---- Asset pack storage (IndexedDB). Nothing here ever leaves the device.
const DB_NAME = 'marbles', STORE = 'pack';
function db() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, 1);
    r.onupgradeneeded = () => r.result.createObjectStore(STORE);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbPut(key, val) { const d = await db(); return new Promise((res, rej) => { const t = d.transaction(STORE, 'readwrite'); t.objectStore(STORE).put(val, key); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function idbGet(key) { const d = await db(); return new Promise((res, rej) => { const t = d.transaction(STORE); const q = t.objectStore(STORE).get(key); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }

const $ = id => document.getElementById(id);
try { sessionStorage.removeItem('marbles-story-in'); } catch {}   // next Story visit walks through the login corridor
const APP_BUILD = 131;   // bump with CACHE in sw.js on every release
const Pack = { zip: null, info: null, cat: null, urls: new Map() };
let packMsg = 'Getting the asset pack…';

// a pack split into parts may carry a catalog.json / pack.json in each part: merge them into one
async function mergedJson(zips, name) {
  const out = {};
  for (const z of zips) {
    const f = z.file(name); if (!f) continue;
    const j = JSON.parse(await f.async('string'));
    for (const [k, v] of Object.entries(j)) {
      if (Array.isArray(v) && Array.isArray(out[k])) out[k] = out[k].concat(v);
      else if (v && typeof v === 'object' && !Array.isArray(v) && out[k] && typeof out[k] === 'object') out[k] = { ...out[k], ...v };
      else if (!(k in out)) out[k] = v;
    }
  }
  return out;
}
async function openPack(blob) {
  // one zip, or the pack split into parts (marbles-pack-1.zip + marbles-pack-2.zip): look files up in each
  const zips = await Promise.all([].concat(blob).map(b => JSZip.loadAsync(b)));
  const zip = { file: n => zips.map(z => z.file(n)).find(Boolean) };
  const infoFile = zip.file('pack.json');
  if (!infoFile) throw new Error('This zip is not an asset pack (no pack.json).');
  Pack.zip = zip; Pack.info = await mergedJson(zips, 'pack.json');
  Pack.cat = await mergedJson(zips, 'catalog.json');
  Pack.urls.forEach(u => URL.revokeObjectURL(u)); Pack.urls.clear();
  const files = Object.values((Pack.cat.menu || {}).files || {}).concat((Pack.cat.menu?.chars || []).map(c => c.face));
  await Promise.all([...new Set(files)].map(async f => { const z = zip.file(f); if (z) Pack.urls.set(f, URL.createObjectURL(await z.async('blob'))); }));
}
const art = k => Pack.urls.get((Pack.cat?.menu?.files || {})[k]) || '';
const hasArt = () => !!art('title_top');

// ---- layout: scale the two DS screens to the phone
function fit() {
  const w = document.documentElement.clientWidth, h = document.documentElement.clientHeight, s = Math.min(w / 256, h / 384);
  $('ds').style.transform = `translate(${(w - 256 * s) / 2}px, ${(h - 384 * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();

// ---- tiny screen builder
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function img(k, x, y, cls = '', extra = '') { const u = art(k); return u ? `<img src="${u}" style="left:${x}px;top:${y}px" class="${cls}" ${extra} alt="">` : ''; }
function bar(text) {
  const b = document.createElement('div'); b.id = 'bar'; b.innerHTML = '<span id="barText"></span>'; $('bot').append(b);
  const t = $('barText'); t.textContent = text;
  requestAnimationFrame(() => {
    const w = t.offsetWidth;
    if (w > 240) { t.style.setProperty('--to', `-${w}px`); t.style.animationDuration = `${(w + 256) / 40}s`; t.classList.add('run'); }
    else { t.style.left = (250 - w) + 'px'; }
  });
}
let screen = 'title', timer = null;
function go(s) { screen = s; clearInterval(timer); timer = null; render(); }
function render() {
  if (!hasArt() && screen !== 'options') screen = 'options';
  ({ title, arena, computer, chars, options })[screen]();
}

// ---- title menu (Story / Battle Arena / Tutorial / My Room / Options) with the rotating character ring
const BTN = [['story', 'Live a season in Bakugan Interspace, one day at a time.', () => { location.href = 'story.html'; }],
  ['arena', 'Practice your Bakugan skills in the Battle Arena.', () => go('arena')],
  ['tutorial', 'Learn how to play Bakugan. (coming later)', null],
  ['myroom', 'Go to My Room and get tips, change your deck, and more.', () => { location.href = 'room.html'; }],
  ['options', 'Change the game options.', () => go('options')]];
const BTN_X = [3, 15, 7, 15, 23];
let pic = 0;
function title() {
  $('top').innerHTML = img('title_top', 0, 0);
  $('bot').innerHTML = img('title_bot', 0, 0) +
    `<div id="pics">${[0, 1, 2, 3, 4].map(i => img('title_pic' + i, 0, 0, 'fade', `data-pic="${i}" style="opacity:${i === pic ? 1 : 0}"`)).join('')}</div>` +
    img('title_ring', 0, 0) +
    BTN.map(([k, , fn], i) => `<img src="${art('btn_' + k)}" class="tap ${fn ? '' : 'off'}" data-b="${i}" style="left:0;top:${35 + 29 * i}px" alt="">`).join('');
  bar('Practice your Bakugan skills in the Battle Arena.');
  $('bot').querySelectorAll('[data-b]').forEach(b => b.onclick = () => {
    const [, msg, fn] = BTN[+b.dataset.b]; $('barText').remove(); $('bar').remove(); bar(msg);
    if (fn) setTimeout(fn, 150);
  });
  // the portraits in the ring take turns, like the DS title menu
  timer = setInterval(() => {
    pic = (pic + 1) % 5;
    document.querySelectorAll('[data-pic]').forEach(e => e.style.opacity = +e.dataset.pic === pic ? 1 : 0);
  }, 4000);
}

// ---- Battle Arena selection: Single Player (needs the computer opponent) / Multiplayer
const rules = () => { try { return localStorage.getItem('marbles-rules') || 'classic'; } catch { return 'classic'; } };
const ARENAS = [['arena', 'ARENA'], ['field_pyrus', 'PYRUS FIELD'], ['field_aquos', 'AQUOS FIELD'], ['field_subterra', 'SUBTERRA FIELD'], ['field_haos', 'HAOS FIELD'], ['field_darkus', 'DARKUS FIELD'], ['field_ventus', 'VENTUS FIELD']];
const arenaPick = () => { try { return localStorage.getItem('marbles-arena') || 'arena'; } catch { return 'arena'; } };
function arena() {
  $('top').innerHTML = img('arena_top', 0, 0) + img('banner_arena', 56, 7);
  $('bot').innerHTML = img('arena_bot', 0, 0) +
    `<div class="obtn huge tap" id="bSingle" style="left:28px;top:44px;width:200px">SINGLE PLAYER</div>` +
    `<div class="obtn huge tap" id="bMulti" style="left:28px;top:96px;width:200px">MULTIPLAYER</div>` +
    `<img src="${art('back')}" class="tap" id="bBack" style="left:223px;top:170px" alt="">`;
  // Arena and Rules on the top screen, as buttons: tap to cycle
  $('top').innerHTML += `<div class="obtn big tap" id="bArena" style="top:66px;left:28px;width:200px"><i class="arr l">‹</i><small>ARENA</small>${(ARENAS.find(a => a[0] === arenaPick()) || ARENAS[0])[1]}<i class="arr r">›</i></div>` +
    `<div class="obtn big tap" id="bRules" style="top:112px;left:28px;width:200px"><i class="arr l">‹</i><small>RULES</small>${rules() === 'nv' ? 'NEW VESTROIA (LIFE GAUGE)' : 'CLASSIC (3 GATE CARDS)'}<i class="arr r">›</i></div>`;
  bar(rules() === 'nv' ? 'New Vestroia rules: bring Life to 0 to win. Up to 9 Ability cards.' : 'Select the type of game.');
  $('bArena').onclick = e => { const b = e.currentTarget.getBoundingClientRect(), d = e.clientX < b.left + b.width / 2 ? -1 : 1;   // left half goes back, right half forward
    const i = ARENAS.findIndex(a => a[0] === arenaPick()); try { localStorage.setItem('marbles-arena', ARENAS[(i + d + ARENAS.length) % ARENAS.length][0]); } catch {} render(); };
  $('bRules').onclick = () => { try { localStorage.setItem('marbles-rules', rules() === 'nv' ? 'classic' : 'nv'); } catch {} render(); };
  $('bSingle').onclick = () => go('computer');
  $('bMulti').onclick = () => { mode = 'multi'; pickFor = 0; picks = [null, null]; teams = null; go('chars'); };
  $('bBack').onclick = () => go('title');
}

// ---- Single Player: how many computer players (1 for now; 3 and 4 player matches come later)
function computer() {
  $('top').innerHTML = img('arena_top', 0, 0) + img('banner_computer', 56, 7);
  $('bot').innerHTML = img('arena_bot', 0, 0) +
    [1, 2, 3].map(n => `<img src="${art('cpu_rows' + n)}" class="tap" data-n="${n}" style="left:30px;top:${10 + n * 36}px" alt="">`).join('') +
    `<img src="${art('back')}" class="tap" id="bBack" style="left:223px;top:170px" alt="">`;
  bar('How many computer-controlled players in the game?');
  $('bot').querySelectorAll('[data-n]').forEach(b => b.onclick = () => {
    const n = +b.dataset.n;
    const begin = (t) => { mode = 'single'; pickFor = 0; picks = Array(n + 1).fill(null); teams = t; go('chars'); };
    if (n === 1) return begin(null);
    if (n === 2) return begin([0, 1, 2]);                                  // 3 players: everyone for themselves
    // 4 players: Tag Team (you and a partner against two) or Battle Royale (everyone for themselves)
    const box = document.createElement('div');
    box.style.cssText = 'position:absolute;left:41px;top:40px;width:174px;height:110px;background:#2b8a9e;border:2px solid #0e2a33;box-shadow:inset 0 0 0 1px #6fc3d3;z-index:30';
    box.innerHTML = `<div class="obtn tap" data-m="tag" style="left:14px;top:14px;width:146px">TAG TEAM (2 VS 2)</div><div class="obtn tap" data-m="royale" style="left:14px;top:48px;width:146px">BATTLE ROYALE</div>`;
    $('bot').append(box);
    box.querySelectorAll('[data-m]').forEach(x => x.onclick = () => begin(x.dataset.m === 'tag' ? [0, 1, 0, 1] : [0, 1, 2, 3]));
  });
  $('bBack').onclick = () => go('arena');
}

// ---- Select Character. Multiplayer: Player 1 picks, then Player 2.
// Single Player: you pick yours, then the computer's character and how hard it plays.
let mode = 'multi', pickFor = 0, picks = [null, null], level = null, page = 'bb', teams = null;   // teams: 3-4 player matches   // page: Battle Brawlers / New Vestroia characters
function chars() {
  const M = Pack.cat.menu, G = M.grid, face = c => c.face && c.face.startsWith('data:') ? c.face : Pack.urls.get(c.face);
  const rowTop = (p, y) => img('hex_empty', 22, y) + img('namebar_' + (picks[p] ? (p ? 'red' : 'blue') : 'grey'), 48, y) +
    (picks[p] ? `<img src="${face(picks[p])}" style="left:27px;top:${y + 3}px" alt="">` : '') +
    img('tag_p' + (p + 1), 16, y - 4) +
    (mode === 'single' ? (p ? img('tag_ai', 40, y - 3) : img('tag_you', 22, y + 22)) : '') +
    (teams && teams.length === 4 && teams[2] === 0 && p ? `<div class="txt" style="left:200px;top:${y + 20}px;font-size:8px">${teams[p] === 0 ? 'PARTNER' : 'OPPONENT'}</div>` : '') +
    (picks[p] ? `<div class="txt" style="left:176px;top:${y + 10}px;font-size:9px">${picks[p].custom ? 'OWN DECK' : (picks[p].level || '').toUpperCase()}</div>` : '') +
    (picks[p] ? `<div class="txt" style="left:78px;top:${y + 9}px;font-size:12px">${esc(picks[p].name)}</div>` : '');
  $('top').innerHTML = img('arena_top', 0, 0) + img('banner_character', 56, 7) + picks.map((_, p) => rowTop(p, picks.length > 2 ? 34 + p * 36 : 40 + p * 38)).join('') +
    (teams && picks.length === 4 && teams[2] === 0 ? `<div class="txt" style="left:200px;top:34px;font-size:9px">TAG TEAM</div>` : teams ? `<div class="txt" style="left:190px;top:34px;font-size:9px">BATTLE ROYALE</div>` : '');
  const onPage = M.chars.filter(c => (c.page || 'bb') === page);
  const frames = picks.map((c, p) => c && (c.page || 'bb') === page ? img('hex_p' + (p + 1), G.x + c.col * G.step - 5, G.y + c.row * G.step - 3) : '').join('');
  $('bot').innerHTML = img('arena_bot', 0, 0) + img(page === 'nv' ? 'ch_grid_nv' : 'ch_grid', 0, 0) + frames +
    onPage.map(c => `<div class="px tap" data-c="${c.id}" style="left:${G.x + c.col * G.step - 5}px;top:${G.y + c.row * G.step - 3}px;width:40px;height:34px"></div>`).join('') +
    (page === 'bb' ? `<div class="px tap" id="cYou" style="left:${G.x - 5}px;top:${G.y - 3}px;width:40px;height:34px"></div>` : '') +
    `<img src="${art('arrow_left')}" class="tap" id="pgL" style="left:4px;top:166px" alt=""><img src="${art('arrow_right')}" class="tap" id="pgR" style="left:150px;top:166px" alt="">` +
    `<div class="txt" style="left:38px;top:172px;width:112px;text-align:center;font-size:9px">${page === 'nv' ? 'New Vestroia' : 'Battle Brawlers'}</div>` +
    `<div class="px tap" id="cRand" style="left:${G.x + 5 * G.step - 5}px;top:${G.y + 2 * G.step - 3}px;width:40px;height:34px"></div>` +
    `<img src="${art('back')}" class="tap" id="bBack" style="left:223px;top:170px" alt="">`;
  const cpu = mode === 'single' && pickFor >= 1;
  const role = teams && teams.length === 4 && teams[2] === 0 ? (teams[pickFor] === 0 ? 'your partner' : 'an opponent') : `computer player ${pickFor}`;
  bar(cpu ? `Select ${picks.length > 2 ? role : "the computer's character"}.` : mode === 'single' ? 'Select your character, or You to build your own deck.' : `Player ${pickFor + 1}: select a character, or You to build your own deck.`);
  // a character plays its own deck at Easy / Normal / Hard; "You" builds a deck (until the Shop and My Room exist)
  const start = () => {
    const custom = picks.some(c => c.custom);
    const title = picks.length === 2 ? `${picks[0].name} vs ${picks[1].name}`
      : teams && teams[2] === 0 ? `${picks[0].name} & ${picks[2].name} vs ${picks[1].name} & ${picks[3].name}` : picks.map(c => c.name).join(' vs ');
    $('bar').remove(); bar(title + (custom ? ' — build your deck!' : ' — battle!'));
    try { sessionStorage.setItem('marbles-match', JSON.stringify({ mode, rules: rules(), arena: arenaPick(), ...(picks.length > 2 ? { teams } : {}), players: picks.map((c, p) => ({ id: c.id, name: c.name, face: c.face,
      ...(c.custom ? { custom: true, ...(c.profile !== undefined ? { profile: c.profile } : {}) } : { level: c.level }), ...(mode === 'single' && p >= 1 ? { ai: true } : {}) })) })); } catch {}
    setTimeout(() => { location.href = 'battle.html'; }, 900);
  };
  const next = () => { if (pickFor < picks.length - 1) { pickFor++; render(); } else { render(); start(); } };
  const choose = c => {
    if (c.custom) { picks[pickFor] = c; return next(); }
    picks[pickFor] = c; render();
    difficulty(c, cpu, lv => { picks[pickFor] = { ...c, level: lv }; next(); });
  };
  $('bot').querySelectorAll('[data-c]').forEach(b => b.onclick = () => choose(M.chars.find(c => c.id === b.dataset.c)));
  $('cRand').onclick = () => choose(onPage[Math.floor(Math.random() * onPage.length)]);
  $('pgL').onclick = $('pgR').onclick = () => { page = page === 'nv' ? 'bb' : 'nv'; render(); };
  if ($('cYou')) $('cYou').onclick = () => {
    if (cpu) { $('bar').remove(); bar('The computer plays a character — pick one of them.'); return; }
    // You = the player picked in My Room (name, face, deck). Player 2 on this device builds a deck instead.
    let pr = null; try { const d = JSON.parse(localStorage.getItem('marbles-profiles') || 'null'); if (d && d.active !== null) pr = d.slots[d.active]; if (pr) pr.idx = d.active; } catch {}
    const taken = picks.some(c => c && c.profile !== undefined);
    if (!pr && !taken && pickFor === 0) { $('bar').remove(); bar('Make your character in My Room first (Title > My Room).'); return; }
    if (pr && !taken && !pr.deck) { $('bar').remove(); bar(`${pr.name} needs a deck — pick a starter deck in My Room.`); return; }
    if (pr && !taken) return choose({ id: 'you', custom: true, profile: pr.idx, name: pr.name, face: pr.face || M.files.face_you, col: 0, row: 0, page: 'bb' });
    choose({ id: 'you', custom: true, name: `Player ${pickFor + 1}`, face: M.files.face_you, col: 0, row: 0, page: 'bb' });
  };
  $('bBack').onclick = () => { if (pickFor > 0) { pickFor = 0; picks = picks.map(() => null); render(); } else go(mode === 'single' ? 'computer' : 'arena'); };
}
// the DS's difficulty box over the character grid
function difficulty(c, cpu, done) {
  const box = document.createElement('div');
  box.style.cssText = 'position:absolute;left:41px;top:30px;width:174px;height:146px;background:#2b8a9e;border:2px solid #0e2a33;box-shadow:inset 0 0 0 1px #6fc3d3;z-index:30';
  box.innerHTML = `<img src="${art('hex_empty')}" style="left:67px;top:8px" alt=""><img src="${Pack.urls.get(c.face)}" style="left:72px;top:11px" alt="">` +
    ['easy', 'normal', 'hard'].map((k, i) => `<div class="tap" data-l="${k}" style="position:absolute;left:12px;top:${50 + i * 30}px;width:148px;height:22px;border-radius:11px;
      background:${i ? '#2c2f33' : '#7aa7e0'};border:2px solid ${i ? '#151719' : '#cfe0f7'};display:flex;align-items:center;justify-content:center">
      <img src="${art('diff_' + k)}" style="position:static" alt=""></div>`).join('');
  $('bot').append(box); $('bar').remove(); bar(cpu ? 'Select the difficulty of the opponent.' : `Pick ${c.name}'s deck: Easy, Normal or Hard.`);
  box.querySelectorAll('[data-l]').forEach(b => b.onclick = () => {
    box.querySelectorAll('[data-l]').forEach(x => { const on = x === b; x.style.background = on ? '#7aa7e0' : '#2c2f33'; x.style.borderColor = on ? '#cfe0f7' : '#151719'; });
    setTimeout(() => { box.remove(); done(b.dataset.l); }, 250);
  });
}

// ---- Options: every setting lives here
const promptGet = () => { try { return localStorage.getItem('marbles-prompt-abilities') !== '0'; } catch { return true; } };
function options() {
  const i = Pack.info;
  const rows = i ? [['App build', APP_BUILD], ['Pack version', i.version], ...Object.entries(i.counts || {})] : [['App build', APP_BUILD], ['Pack', 'not loaded']];
  $('top').innerHTML = (img('options_top', 0, 0) || '<div class="txt" style="left:12px;top:8px;font-size:16px">OPTIONS</div>') +
    `<div class="txt" style="left:22px;top:28px;font-size:9px">${esc(packMsg)}</div>` +
    `<div class="rows">${rows.map(([k, v]) => `<div><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('')}</div>`;
  const items = [['prompt', `Prompt Ability Cards: ${promptGet() ? 'On' : 'Off'}`], ['update', 'Check for Asset Pack Update'], ['file', 'Load Asset Pack from File']];
  $('bot').innerHTML = (img('options_bot', 0, 0) || '') +
    items.map(([k, t], n) => `<button class="obtn tap" data-o="${k}" style="top:${44 + n * 24}px">${esc(t)}</button>`).join('') +
    (hasArt() ? `<img src="${art('back')}" class="tap" id="bBack" style="left:223px;top:170px" alt="">` : '');
  bar(hasArt() ? 'Select the option you want to change.' : 'Load the asset pack to start.');
  $('bot').querySelectorAll('[data-o]').forEach(b => b.onclick = () => {
    const k = b.dataset.o;
    if (k === 'prompt') { try { localStorage.setItem('marbles-prompt-abilities', promptGet() ? '0' : '1'); } catch {} render(); }
    if (k === 'update') checkUpdate(true);
    if (k === 'file') $('packFile').click();
  });
  if ($('bBack')) $('bBack').onclick = () => go('title');
}

$('packFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  packMsg = 'Loading…'; render();
  try { await openPack(f); await idbPut('pack', f); packMsg = 'Saved on this device.'; }
  catch (err) { packMsg = err.message; }
  e.target.value = ''; render();
});
// ---- Auto-update: download the pack from this site only when its version changed.
async function checkUpdate(manual) {
  let remote;
  try { remote = await (await fetch('pack/version.json', { cache: 'no-store' })).json(); }
  catch { if (manual) { packMsg = 'Offline. Using the pack on this device.'; render(); } return; }
  if (Pack.info && Pack.info.version === remote.version) { packMsg = manual ? 'Up to date (v' + remote.version + ').' : 'Ready.'; if (manual) render(); return; }
  packMsg = 'Downloading pack v' + remote.version + '…'; render();
  try {
    // the pack comes in parts (version.json lists them); older sites had one marbles-pack.zip
    const parts = remote.files || ['marbles-pack.zip'];
    const blobs = await Promise.all(parts.map(async f => {
      const r = await fetch('pack/' + f + '?v=' + encodeURIComponent(remote.version), { cache: 'no-store' });
      if (!r.ok) throw new Error('Download failed (' + r.status + ').');
      return r.blob();
    }));
    // version.json is the source of truth: remember the version we downloaded, whatever pack.json inside says
    await openPack(blobs); await idbPut('pack', blobs); await idbPut('packVersion', remote.version); Pack.info.version = remote.version;
    packMsg = 'Updated to v' + remote.version + '.';
    if (screen === 'options' && hasArt() && !manual) screen = 'title';
  } catch (err) { packMsg = err.message; }
  render();
}

(async () => {
  try { const saved = await idbGet('pack'); if (saved) { await openPack(saved); const v = await idbGet('packVersion'); if (v) Pack.info.version = v; packMsg = 'Ready.'; } } catch {}
  render();
  checkUpdate(false);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  window.MENU = { go, get screen() { return screen; } };
})();
</script>
