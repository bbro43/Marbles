<!doctype html><html><body style="margin:0;background:#9fb3c8">
<!-- The crown model alone, close up, front and side: checks its texture and shape -->
<script src="../vendor/jszip.min.js"></script>
<script type="importmap">
{ "imports": { "three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Pack } from '../js/pack.js';
const pack = await Pack.fromDevice(), g = await new GLTFLoader().loadAsync(await pack.url('creator/models/crown_00/crown_00.glb'));
const info = []; g.scene.traverse(o => { if (o.isMesh) info.push({ type: o.material.type, map: !!o.material.map, img: o.material.map?.image?.width + 'x' + o.material.map?.image?.height, uv: !!o.geometry.attributes.uv, flat: o.material.flatShading }); });
window.INFO = info;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(1000, 400); r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement); r.setScissorTest(true);
const sc = new THREE.Scene(); sc.add(new THREE.AmbientLight(0xffffff, 1.2)); const dl = new THREE.DirectionalLight(0xffffff, 2); dl.position.set(0.5, 1, 1); sc.add(dl);
const mode = new URLSearchParams(location.search).get('m') || 'gltf';
g.scene.traverse(o => { if (o.isMesh && mode === 'lambert') o.material = new THREE.MeshLambertMaterial({ map: o.material.map, side: THREE.DoubleSide }); });
sc.add(g.scene);
const c = new THREE.Vector3(0, 0.712, 0.018);
[[0, 0], [1.3, 1]].forEach(([yaw, i]) => { const cam = new THREE.OrthographicCamera(-0.06, 0.06, 0.024, -0.024, 0.001, 10); cam.position.set(c.x + Math.sin(yaw), c.y + 0.15, c.z + Math.cos(yaw)); cam.lookAt(c);
  r.setViewport(i * 500, 0, 500, 400); r.setScissor(i * 500, 0, 500, 400); r.render(sc, cam); });
document.title = 'done';
</script></body></html>
