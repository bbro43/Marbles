<!doctype html><html><body style="margin:0;background:#9fb3c8">
<!-- One clothing part on its own (no body), front and back: ?looks=top:4:0,top:13:0 (part:style:color) -->
<script src="../vendor/jszip.min.js"></script>
<script type="importmap">
{ "imports": { "three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { Pack } from '../js/pack.js';
import { buildAvatar, DEFAULT_LOOK } from '../js/avatar.js';
const pack = await Pack.fromDevice(), url = p => pack.url(p), Q = new URLSearchParams(location.search);
const IDX = { top: 1, down: 2, shoes: 3 }, W = 300, H = 380;
const specs = (Q.get('looks') || 'top:4:0').split(',').map(x => x.split(':'));
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W * specs.length * 2, H); r.setClearColor(0x9fb3c8); r.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(r.domElement);
r.setScissorTest(true);
let col = 0;
for (const [part, st, c] of specs) {
  const look = JSON.parse(JSON.stringify({ ...DEFAULT_LOOK, [part]: [+st, +c] }));
  const av = await buildAvatar(look, url), grp = av.children[0];
  grp.children.forEach((sc, i) => sc.visible = i === IDX[part]);
  // pieces of a top that live on the pants (the coat's tails) still show; the pants themselves don't
  if (part === 'top') grp.children[2].visible = true, grp.children[2].traverse(o => { if (o.isMesh && (o.material.map?.name || '').match(/^x?down|^skin/)) o.visible = false; });
  grp.children[IDX[part]].traverse(o => { if (o.isMesh && /^skin|gauntlet/.test(o.material.map?.name || '')) o.visible = false; });   // no arms or hands
  const sc = new THREE.Scene(); sc.add(new THREE.AmbientLight(0xffffff, 2.2)); sc.add(av); av.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(grp.children[IDX[part]], true), cen = box.getCenter(new THREE.Vector3()), R = Math.max(...box.getSize(new THREE.Vector3()).toArray()) * 0.62;
  for (const yaw of [0.35, Math.PI + 0.35]) {
    const cam = new THREE.OrthographicCamera(-R * W / H, R * W / H, R, -R, 0.01, 50); cam.position.set(cen.x + Math.sin(yaw) * 5, cen.y + 0.4, cen.z + Math.cos(yaw) * 5); cam.lookAt(cen);
    r.setViewport(col * W, 0, W, H); r.setScissor(col * W, 0, W, H); r.render(sc, cam); col++;
  }
}
document.title = 'done';
</script></body></html>
