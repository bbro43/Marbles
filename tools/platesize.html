<!doctype html><html><body>
<!-- Measures the Gundalian band (the gold plate) in the pack's model units, for a few hair styles -->
<script src="../vendor/jszip.min.js"></script>
<script type="importmap">
{ "imports": { "three": "../vendor/three/build/three.module.js", "three/addons/": "../vendor/three/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { Pack } from '../js/pack.js';
import { buildAvatar, DEFAULT_LOOK } from '../js/avatar.js';
const pack = await Pack.fromDevice(), url = p => pack.url(p), out = [];
for (const h of [2, 9, 12]) {
  const av = await buildAvatar({ ...JSON.parse(JSON.stringify(DEFAULT_LOOK)), race: 'gundalian', hair: [h, 1] }, url), grp = av.children[0];
  grp.updateMatrixWorld(true); const inv = new THREE.Matrix4().copy(grp.matrixWorld).invert();
  let plate = null; grp.traverse(o => { if (o.isMesh && !o.isSkinnedMesh && o.material.color?.getHexString() === 'a99a49') plate = o; });
  const P = plate.geometry.attributes.position, v = new THREE.Vector3(), box = new THREE.Box3();
  for (let i = 0; i < P.count; i++) box.expandByPoint(v.fromBufferAttribute(P, i).applyMatrix4(plate.matrixWorld).applyMatrix4(inv));
  out.push({ hair: h, min: box.min.toArray().map(x => +x.toFixed(4)), max: box.max.toArray().map(x => +x.toFixed(4)), tris: P.count });
}
window.OUT = out; document.title = 'done';
</script></body></html>
