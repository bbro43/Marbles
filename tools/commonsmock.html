<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="../story.css" onerror="this.remove()">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui}
#map{position:fixed;inset:0} .tag{position:absolute;left:0;top:0;pointer-events:none;white-space:nowrap;font:800 10px system-ui;padding:2px 6px;border-radius:8px;color:#fff;background:#0b2a4acc;border:1px solid #39b6ff}
.tag.show{background:#3a2a00cc;border-color:#ffcf3a}
.pin{position:absolute;left:0;top:0;pointer-events:none;font:800 10px system-ui;color:#fff;background:#000a;border-radius:6px;padding:1px 5px}</style></head>
<body><div id="map"></div>
<script src="../vendor/jszip.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "../vendor/three/build/three.module.js",
  "three/addons/": "../vendor/three/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { Pack } from '../js/pack.js';
import { mountCommons } from '../js/commons3d.js';
import { buildAvatar, randomLook, idle } from '../js/avatar.js';
const pack = await Pack.fromDevice();
const host = document.getElementById('map');
const C = mountCommons(host, { slot: 'Afternoon', onPick() {}, counts: {} });
const q = new URLSearchParams(location.search);
C.view(+(q.get('yaw') || 0.3), +(q.get('dist') || 95), +(q.get('pitch') || 0.42));
const S = 3.2;   // a brawler's height in Commons units (a little bigger than life so they read on a phone)
const ppl = [], tags = [];
const NEW = [['Mira-style newcomer', 0], ['Kai', 1], ['Sora', 2], ['Juno', 3], ['Rex', 4], ['Lena', 5]];
const spots = [[-8, 19], [-4, 20.5], [6, 19.5], [10, 17], [14.5, 13], [-14, 15]];
let i = 0;
for (const [x, z] of spots) {
  const L = randomLook(); const a = await buildAvatar(L, p => pack.url(p));
  a.scale.setScalar(S); a.position.set(x, 0.1, z); a.rotation.y = Math.atan2(-x, -z) + (i % 2 ? 0.6 : -0.4); C.scene.add(a); ppl.push(a);
  const el = document.createElement('div'); el.className = 'tag'; el.textContent = ['Kai Rhodes', 'Sora Vance', 'Juno Park', 'Rex Holt', 'Lena Cruz', 'Milo Tran'][i]; host.appendChild(el);
  tags.push({ el, o: a, h: S + 0.6 }); i++;
}
// show characters: a glowing hologram marker with a name tag (no model)
for (const [nm, x, z] of [['Dan', 1, 18.5], ['Shun', -11, 17.5], ['Marucho', 16, 9]]) {
  const g = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 1.1, 0.15, 24), new THREE.MeshBasicMaterial({ color: 0xffcf3a, transparent: true, opacity: 0.7 })); g.add(base);
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 1.0, S, 20, 1, true), new THREE.MeshBasicMaterial({ color: 0xffe27a, transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false })); beam.position.y = S / 2; g.add(beam);
  const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.55), new THREE.MeshBasicMaterial({ color: 0xffcf3a })); gem.position.y = S + 0.2; g.add(gem);
  g.position.set(x, 0.1, z); C.scene.add(g);
  const el = document.createElement('div'); el.className = 'tag show'; el.textContent = nm; host.appendChild(el); tags.push({ el, o: g, h: S + 1.3, gem });
}
const v = new THREE.Vector3(), t0 = performance.now();
function loop() {
  const t = (performance.now() - t0) / 1000;
  for (const a of ppl) idle(a, t);
  for (const T of tags) { if (T.gem) T.gem.rotation.y = t * 2;
    v.set(T.o.position.x, T.o.position.y + T.h, T.o.position.z).project(C.camera);
    T.el.style.transform = `translate(${(v.x + 1) / 2 * innerWidth}px,${(1 - v.y) / 2 * innerHeight}px) translate(-50%,-100%)`; T.el.style.display = v.z < 1 ? '' : 'none'; }
  requestAnimationFrame(loop);
}
loop(); setTimeout(() => document.title = 'done', 1500);
</script></body></html>
