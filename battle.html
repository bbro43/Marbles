<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1417">
<title>Marbles — Battle</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192-v2.png">
<style>
  :root { color-scheme: dark; --panel: rgba(18,24,31,.88); --line:#2a3644; --text:#e8edf2; --dim:#93a2b2; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin:0; height:100%; background:#0d1014; color:var(--text); font:15px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif; overflow:hidden; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; padding-top: env(safe-area-inset-top); }
  #view { flex:1; position:relative; min-height:0; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  .top { position:absolute; top:8px; left:8px; right:8px; display:flex; justify-content:space-between; align-items:flex-start; gap:8px; pointer-events:none; }
  .pl { background:var(--panel); border:1px solid var(--line); border-left:6px solid var(--pc, #555); border-radius:12px; padding:6px 10px; min-width:110px; }
  .pl.active { border-color:var(--pc); box-shadow:0 0 0 2px var(--pc); }
  .pl.nv { background:linear-gradient(#6b7177, #34383d 55%, #4a4f55); border:2px solid #c3c9cf; border-left-width:2px; border-radius:10px; box-shadow:inset 0 0 0 2px #1d2024, 0 2px 6px #0008; padding:5px 10px 6px 6px; }
  .pl.nv.active { box-shadow:inset 0 0 0 2px #1d2024, 0 0 0 2px var(--pc), 0 2px 8px #000a; }
  .pl.nv .face { width:40px; height:40px; margin:0 8px 0 0; border:2px solid #e1e5e9; border-radius:5px; background:#f2f4f6; box-shadow:0 0 0 1px #1d2024; }
  /* New Vestroia boxes: face beside name, gauge and Life, mirrored for player 2, same height both sides */
  .pl.nv { display:grid; grid-template-columns:auto 1fr; column-gap:8px; align-items:center; }
  .pl.nv .face { grid-row:1 / 3; grid-column:1; float:none; margin:0; }
  .pl.nv .n { grid-column:2; } .pl.nv > div:last-child { grid-column:2; }
  #p1.nv { grid-template-columns:1fr auto; text-align:right; }
  #p1.nv .face { grid-column:2; } #p1.nv .n, #p1.nv > div:last-child { grid-column:1; }
  #p1.nv .lg { justify-content:flex-start; }
  .lg { display:flex; gap:2px; margin:4px 4px 1px; transform:skewX(-28deg); }
  #p1 .lg { flex-direction:row-reverse; transform:skewX(28deg); }
  .lg i { position:relative; width:16px; height:12px; background:#23272b; border:1px solid #0f1113; box-shadow:inset 0 1px 0 #fff2; overflow:hidden; }
  .lg i b { position:absolute; left:0; top:0; bottom:0; transition:width .6s; box-shadow:inset 0 2px 0 #fff5, inset 0 -2px 0 #0003; }
  #p1 .lg i b { left:auto; right:0; }
  .pl.nv small { font-size:10px; color:#e8edf2; }
  .pl .n { font-weight:700; } .pl .life { width:90px; height:8px; background:#222; border:1px solid #fff6; border-radius:4px; overflow:hidden; margin-top:3px; } .pl .life i { display:block; height:100%; transition: width .6s; } .pl small { font-size:11px; } .pl .face { float:left; width:32px; height:32px; margin:-2px 6px 0 -4px; image-rendering:pixelated; } .dot { display:inline-block; width:12px; height:12px; border-radius:50%; border:2px solid #d4af37; margin-right:4px; }
  .dot.on { background:#d4af37; }
  #timer { position:absolute; top:96px; left:50%; transform:translateX(-50%); z-index:60; background:#000a; color:#ffd54a; border-radius:999px; padding:4px 10px; font-weight:700; }
  #ask { position:absolute; left:10px; right:10px; bottom:56px; z-index:55; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px; }
  #ask .row2 { display:flex; gap:10px; margin-top:12px; } #ask .row2 .btn { flex:1; } #askText { font-weight:700; font-size:18px; }
  #abtn { position:absolute; bottom:10px; right:10px; background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:8px 12px; font:inherit; }
  #abtn:disabled { opacity:.4; } #abtn.ready { border-color:#ffd54a; box-shadow:0 0 0 2px #ffd54a55; }
  #alist { display:flex; flex-direction:column; gap:8px; margin-bottom:10px; } #alist .ahead { font-weight:700; }
  #alist .chip { text-align:left; } #alist .chip.dim { opacity:.4; }
  .aprompt { display:flex; gap:8px; align-items:center; margin:6px 0 10px; }
  #back { position:absolute; bottom:10px; left:10px; background:var(--panel); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:8px 12px; font:inherit; text-decoration:none; }
  #msg { position:absolute; left:0; right:0; top:64px; text-align:center; font-weight:600; text-shadow:0 2px 6px #000; padding:0 12px; pointer-events:none; }
  #flash { position:absolute; left:0; right:0; top:38%; text-align:center; font-size:54px; font-weight:900; letter-spacing:2px; color:#ffd54a;
            text-shadow:0 0 18px #d8322b, 0 4px 0 #7a0f0b; pointer-events:none; opacity:0; z-index:3; }
  #flash.go { animation: flash 1.4s ease-out; }
  @keyframes flash { 0% { opacity:0; transform:scale(.4); } 15% { opacity:1; transform:scale(1.15); } 30% { transform:scale(1); } 80% { opacity:1; } 100% { opacity:0; } }
  #picker { display:flex; gap:8px; padding:10px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); background:#121820; border-top:1px solid var(--line); overflow-x:auto; min-height:64px; }
  #picker.off { opacity:.4; pointer-events:none; }
  .chip { flex:1 0 auto; text-align:left; background:#1b2430; color:var(--text); border:2px solid #2a3644; border-left:8px solid var(--c); border-radius:12px; padding:8px 12px; font:inherit; cursor:pointer; }
  .chip b { display:block; } .chip span { color:var(--dim); font-size:13px; display:block; } .chip .st { font-size:12px; }
  .chip.sel { border-color:#fff; border-left-color:var(--c); }
  #bplay { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; } #bplay:empty { display:none; }
  #bplay .chip em { font-style:normal; font-weight:600; color:#9fe39f; margin-left:6px; }
  #bplay .who2 { width:100%; font-weight:700; }
  #bplay .chip { flex:1 1 100%; } #bplay .chip.skip { flex:0 0 auto; }
  .chip .st { white-space:normal; }
  #picker .chip.red .st { max-width:220px; max-height:3.6em; overflow:hidden; }
  .chip.skip { flex:0 0 auto; border-left-color:#2a3644; }
  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:24px; background:#0d1014; z-index:5; }
  .overlay { position:absolute; inset:0; background:rgba(5,8,12,.78); display:flex; align-items:center; justify-content:center; z-index:4; padding:12px; }
  .overlay[hidden] { display:none; }
  .box { max-height:92vh; overflow:auto; background:#141b23; border:1px solid var(--line); border-radius:16px; padding:16px; width:min(560px,100%); }
  #bcard { text-align:center; color:var(--dim); margin-bottom:10px; } #bcard .gpic { display:block; margin:0 auto 6px; height:120px; border-radius:6px; box-shadow:0 2px 10px #000a; }
  #bbody { display:flex; align-items:flex-start; gap:8px; }
  .side { flex:1; text-align:center; min-width:0; }
  .who { color:var(--dim); font-size:13px; } .toy { font-weight:700; margin:4px 0; }
  .attr { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
  .g { font-size:42px; font-weight:800; font-variant-numeric:tabular-nums; }
  .steps { min-height:44px; } .step { font-size:13px; color:#cfe3ff; margin-top:4px; }
  .winner { margin-top:8px; font-size:22px; font-weight:900; color:#ffd54a; letter-spacing:1px; min-height:28px; }
  /* 3-4 players: two columns of smaller boxes (Tag Team: teammates share a column) */
  .top .col { display:flex; flex-direction:column; gap:4px; }
  .top.four .pl { padding:3px 6px; min-width:0; } .top.four .pl.nv .face { width:28px; height:28px; } .top.four .lg i { width:11px; height:9px; }
  .top.four .pl .n { font-size:12px; } .top.four .pl small { font-size:9px; }
  #p3.nv, #p1.nv { grid-template-columns:1fr auto; text-align:right; } #p3.nv .face { grid-column:2; } #p3.nv .n, #p3.nv > div:last-child { grid-column:1; }
  #p3 .lg { flex-direction:row-reverse; transform:skewX(28deg); } #p3 .lg i b { left:auto; right:0; }
  .pl.out { opacity:.4; filter:grayscale(1); }
  #bbody.multi { flex-wrap:wrap; } #bbody.multi .side { flex:1 1 44%; } #bbody.multi .vs { display:none; }
  .side .team { font-size:11px; color:var(--dim); }
  .vs { align-self:center; font-size:22px; color:var(--dim); width:44px; text-align:center; }
  .vs.big { font-size:56px; color:#fff; font-weight:900; }
  .btn { display:block; width:100%; margin-top:14px; padding:14px; font:inherit; font-size:17px; font-weight:700; color:#fff; background:#d8322b; border:0; border-radius:12px; cursor:pointer; }
  #overText { font-size:30px; font-weight:900; text-align:center; }
.chip.withart { display: flex; gap: 8px; align-items: center; text-align: left; }
.chip.withart .cart { width: 54px; height: 76px; object-fit: cover; border-radius: 4px; flex: 0 0 auto; box-shadow: 0 1px 4px #0008; }
.chip.withart .ctext { display: flex; flex-direction: column; min-width: 0; }
</style>
</head>
<body>
<div id="wrap">
  <div id="view">
    <div class="top">
      <div class="col"><div class="pl" id="p0"><div class="n" id="p0name">Player 1</div><div id="p0gates"></div></div>
        <div class="pl" id="p2" hidden><div class="n" id="p2name">Player 3</div><div id="p2gates"></div></div></div>
      <div class="col"><div class="pl" id="p1"><div class="n" id="p1name">Player 2</div><div id="p1gates"></div></div>
        <div class="pl" id="p3" hidden><div class="n" id="p3name">Player 4</div><div id="p3gates"></div></div></div>
    </div>
    <div id="msg"></div>
    <div id="flash"></div>
    <a id="back" href="./">Home</a>
    <button id="abtn" disabled>Ability cards</button>
    <div id="timer" hidden></div>
    <div id="ask" hidden>
      <div id="askText"></div>
      <div class="row2"><button class="btn" id="askYes">Yes</button><button class="btn" id="askNo" style="background:#2a3644">No</button></div>
    </div>
    <div class="overlay" id="apanel" hidden><div class="box">
      <div id="alist"></div>
      <label class="aprompt"><input type="checkbox" id="aprompt"> Prompt Ability Cards</label>
      <button class="btn" id="aclose">Close</button>
    </div></div>
    <div id="loading">Loading…</div>
    <div class="overlay" id="battle" hidden><div class="box">
      <div id="bcard"></div><div id="bbody"></div><div id="bplay"></div>
      <button class="btn" id="bnext" hidden>Continue</button>
    </div></div>
    <div class="overlay" id="over" hidden><div class="box">
      <div id="overText"></div>
      <button class="btn" id="again">Play again</button>
      <a class="btn" href="./" style="text-align:center;text-decoration:none;background:#2a3644">Home</a>
    </div></div>
  </div>
  <div id="picker"></div>
</div>
<script src="vendor/jszip.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/build/three.module.js",
  "three/addons/": "./vendor/three/examples/jsm/"
} }
</script>
<script type="module" src="js/battle.js"></script>
</body>
</html>
